- include_tasks: apt.yml

- name: copy base nginx.conf
  copy:
    src: _env/nginx/nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: '0644'
  register: nginx_base

- name: copy mime types
  copy:
    src: _env/nginx/mime.types
    dest: /etc/nginx/mime.types
    owner: root
    group: root
    mode: '0644'

- name: install study site config
  template:
    src: lobsters-study.conf.j2
    dest: /etc/nginx/sites-available/lobsters
    owner: root
    group: root
    mode: '0644'
  register: nginx_site

- name: enable site
  file:
    src: /etc/nginx/sites-available/lobsters
    dest: /etc/nginx/sites-enabled/lobsters
    state: link

- name: remove default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Enable nginx at startup
  systemd:
    name: nginx
    enabled: yes

- name: Reload nginx
  when: nginx_base.changed or nginx_site.changed
  systemd:
    name: nginx
    state: reloaded
