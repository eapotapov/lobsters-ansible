- include_tasks: apt.yml

- name: groupadd lobsters
  tags: user
  group:
    name: "{{ lobsters_user }}"
    state: present

- name: useradd lobsters
  tags: user
  user:
    name: "{{ lobsters_user }}"
    comment: "Lobsters Study"
    group: "{{ lobsters_user }}"
    home: "{{ lobsters_home }}"
    shell: /bin/bash
    state: present

- name: home perms
  tags: user
  file:
    path: "{{ lobsters_home }}/"
    state: directory
    mode: "0755"

- name: cp bash_profile
  copy:
    src: bash_profile
    dest: "{{ lobsters_home }}/.bash_profile"
    owner: "{{ lobsters_user }}"
    group: "{{ lobsters_user }}"
    mode: "0644"

- name: get recent ruby-build versions
  become: true
  become_user: "{{ lobsters_user }}"
  git:
    repo: https://github.com/rbenv/ruby-build.git
    dest: "{{ lobsters_home }}/.rbenv/plugins/ruby-build"
    force: yes

- name: Clone first version for rbenv ruby detection
  become: true
  become_user: "{{ lobsters_user }}"
  git:
    repo: "{{ versions[0].repo }}"
    dest: "{{ lobsters_home }}/{{ versions[0].name }}"
    version: "{{ versions[0].commit }}"
    force: yes

- name: install ruby via rbenv
  become: true
  become_user: "{{ lobsters_user }}"
  shell: rbenv install --skip-existing
  environment:
    RUBY_CONFIGURE_OPTS: --enable-yjit
  args:
    chdir: "{{ lobsters_home }}/{{ versions[0].name }}"

- name: Deploy each Lobsters version
  include_tasks: deploy_version.yml
  loop: "{{ versions }}"
  loop_control:
    loop_var: version

- name: Update test user password for each version
  become: true
  become_user: "{{ lobsters_user }}"
  shell: |
    cd {{ lobsters_home }}/{{ item.name }}
    ~/.rbenv/shims/bundle exec rails runner \
      "u = User.find_by(username: 'test'); u.password = 'testtest'; u.password_confirmation = 'testtest'; u.save!"
  environment:
    RAILS_ENV: development
  loop: "{{ versions }}"
  ignore_errors: yes
  tags: [seed]
